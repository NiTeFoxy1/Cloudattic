spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/Cloudattic
    username: postgres
    password: 1206
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  logging:
    level:
      org.flywaydb: DEBUG
  security:
    user:
      name: admin
      password: admin
  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
server:
  port: 8080